<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <link rel="stylesheet" href="css/secondmaster.css">
</head>
<body>
    <div class="slideshow-container">
        <div class="slide">
            <img src="images/tranding-food-1.png" alt="Image 1">
        </div>
        <div class="slide">
            <img src="images/tranding-food-2.png" alt="Image 2">
        </div>
        <div class="slide">
            <img src="images/tranding-food-3.png" alt="Image 3">
        </div>
        <div class="controls">
            <button id="prev">previous</button>
            <button id="next">next</button>
            <button id="slideShow">slide show</button>
            <button id="stop">stop</button>
        </div>
    </div>
    <script src="js/secondScript.js"></script>
</body>
</html>
